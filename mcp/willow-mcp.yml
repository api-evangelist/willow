source: https://onewillow.com/api/ucp/mcp
name: Willow Pump UCP Commerce MCP Server
description: Willow's online store at onewillow.com exposes a live, anonymous Model Context Protocol endpoint
  implementing the Universal Commerce Protocol (UCP) shopping service. An MCP client POSTs JSON-RPC to
  https://onewillow.com/api/ucp/mcp; tools/list answers unauthenticated and returns 13 tools with full
  JSON Schema 2020-12 input schemas covering catalog search and lookup, cart lifecycle, checkout lifecycle,
  and order retrieval. The runtime is Shopify's `universal-commerce` server (serverInfo name universal-commerce,
  version 0.1.0) served under Willow's own domain; the merchant identity in the discovery document is
  Willow's (merchant_name "Willow Pump", merchant_origin onewillow.com, Shopify shop id 15958015).
ownership_note: Platform-authored runtime, first-party surface. The MCP server code and tool schemas are
  Shopify's UCP implementation, not software Willow wrote; the endpoint, catalog, prices, carts and orders
  it serves are Willow's. Recorded as Willow's agent surface because it answers on Willow's registrable
  domain and transacts Willow's own products — not as a Willow-authored protocol implementation.
deployment:
  mode: remote
  endpoint: https://onewillow.com/api/ucp/mcp
  auth: none
  verified: probed
  note: 'tools/list and initialize answer anonymously. tools/call additionally requires a resolvable UCP
    agent profile URI in meta["ucp-agent"].profile, and order-scoped tools require a signed agent JWT
    (observed: get_order returns JSON-RPC -32000 "AuthenticationRequired ... a valid JWT is required").
    A second, equivalent endpoint answers on the Shopify-canonical host https://willowpump.myshopify.com/api/ucp/mcp.
    The endpoint is POST-only: a GET of https://onewillow.com/api/ucp/mcp returns the storefront''s HTML
    404 page, so a link-liveness crawler will read it as dead. It is not — it answered JSON-RPC 200 on
    2026-09-04.'
protocol:
  jsonrpc: '2.0'
  mcp_protocol_version: '2024-11-05'
  server_info:
    name: universal-commerce
    version: 0.1.0
  server_capabilities:
  - tools
  - prompts
  - resources
  - logging
  ucp_version: '2026-08-25'
  ucp_api_version_header: x-shopify-ucp-mcp-api-version
  transport: mcp (HTTP POST, application/json; Accept application/json, text/event-stream)
discovery:
