note: >-
  Willow states that its agent endpoint is rate limited but publishes no number, window or quota.
  What it does return on every call is a running cost signal — shopify-complexity-score and
  shopify-complexity-score-v2 — which an agent can use to pace itself even without a documented
  ceiling. A tools/list cost 370 (v2 37) and a tools/call of search_catalog cost 4940 (v2 494),
  so calls are priced by complexity rather than counted flat.
