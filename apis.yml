apis:
- name: Willow Pump UCP Commerce MCP
  description: >-
    Willow's storefront agent surface — a JSON-RPC 2.0 Model Context Protocol endpoint implementing
    the Universal Commerce Protocol 2026-08-25 shopping service. tools/list answers unauthenticated
    and returns 13 tools with full JSON Schema 2020-12 input schemas: search_catalog, lookup_catalog
    and get_product for the catalog; create/get/update/cancel_cart and create/get/update/complete/
    cancel_checkout for the purchase flow; and get_order behind a signed agent JWT. Every tools/call
    requires a resolvable UCP agent profile URI, complete_checkout requires an idempotency key, and
    payment requires explicit buyer approval. The runtime is Shopify's universal-commerce server
    running under Willow's own domain and transacting Willow's own catalog.
  humanURL: https://onewillow.com/agents.md
  baseURL: https://onewillow.com/api/ucp/mcp
  image: https://onewillow.com/cdn/shop/files/OG-Image_db607121-7a26-49c9-b231-3a1e572a0fca_1200x630.jpg?v=1716782735
