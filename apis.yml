aid: willow
name: Willow
description: >-
  Willow Innovations, Inc. is a Mountain View, California consumer health-technology company founded
  in 2014 that makes wearable, in-bra breast pumps — the Willow 360, Willow Go and the Wave manual
  pump — sold direct to consumers at onewillow.com and paired with a mobile app that tracks output
  and controls suction. Willow publishes no developer programme, API keys or OpenAPI, but its
  storefront is an agent-callable surface: it serves a Universal Commerce Protocol merchant profile
  at /.well-known/ucp.json and a live, anonymous MCP endpoint at /api/ucp/mcp exposing 13 tools for
  catalog search, cart, checkout and order retrieval, alongside published agent instructions
  (agents.md, llms.txt) and OAuth 2.0/OIDC customer-account discovery documents.
